<style>

  --bg: #eceff0;
  --surface: #ffffff;
  --ink: #11181c;
  --muted: #5a686e;
  --line: #d3dadc;

  --accent-soft: #d6efea;

  --shadow: 0 10px 30px rgba(10, 30, 28, 0.16);

  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1113;
    --surface: #151c1f;
    --ink: #e7eeef;
    --muted: #8c9ca2;
    --line: #263135;
    --accent: #4fd6bd;
    --accent-ink: #03211c;
    --accent-soft: #123b35;
    --danger: #ff8a80;
    --paper-bg: #151c1f;
    --paper-ink: #e7eeef;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);

  }
}
:root[data-theme="dark"] {
  --bg: #0c1113;
  --surface: #151c1f;
  --ink: #e7eeef;
  --muted: #8c9ca2;
  --line: #263135;
  --accent: #4fd6bd;
  --accent-ink: #03211c;

html, body { height: 100%; }
body {

  font-family: var(--font-ui);

}

button { cursor: pointer; }
#app { position: relative; height: 100%; max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ibtn:hover { background: var(--accent-soft); }

.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.home-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 14px; }

.brand span { color: var(--accent); }
.homeq { margin: 12px 0 8px; min-height: 48px; width: 100%; padding: 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 16px; }
.note { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.list { flex: 1; min-height: 0; overflow-y: auto; display: grid; align-content: start; gap: 10px; padding: 4px 0 110px; }
.empty { padding: 36px 8px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-width: 860px; max-height: 84%; margin: 0 auto; overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow); animation: up 0.22s ease-out; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 12px; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; font-size: 15px; font-weight: 500; }
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt svg { color: var(--accent); flex: none; }
.opt.danger { color: var(--danger); }
.opt.danger svg { color: var(--danger); }
.field { display: grid; gap: 6px; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field textarea { width: 100%; min-width: 0; min-height: 48px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; font-size: 16px; font-weight: 400; color: var(--ink); }
.field textarea { min-height: 120px; resize: vertical; }
.rowbtn { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
.stat span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
.result { white-space: pre-wrap; padding: 12px; margin: 8px 0; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; max-height: 34vh; overflow-y: auto; color: var(--ink); font-size: 15px; }

[hidden] { display: none !important; }
input, textarea, select { box-sizing: border-box; max-width: 100%; }
.field { min-width: 0; }
.filewrap { position: relative; display: inline-flex; }
.ovl { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 0; cursor: pointer; z-index: 2; }
.opt.filewrap { position: relative; }
*, *::before, *::after { box-sizing: border-box; }
.top { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
.hbtns { display: flex; }
.hbtns svg, .row svg, .fab svg, .btn svg, .opt svg, .ibtn svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.content { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 110px; }

.seg { display: flex; gap: 6px; margin: 10px 0; overflow-x: auto; }

.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 6px 8px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-align: left; }
.row:active { background: var(--accent-soft); }
.cov { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.meta { flex: 1; min-width: 0; display: grid; }
.meta .t { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .s { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.star { color: var(--accent); font-size: 18px; }
.empty { padding: 40px 12px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h2 { color: var(--ink); margin: 0; font-size: 20px; }
.lock { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; background: var(--bg); text-align: center; }
.lock .logo { width: 84px; height: 84px; border-radius: 26px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.lock .logo svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lock form { display: grid; gap: 10px; width: min(100%, 340px); }
.lock .err { color: #d33; min-height: 1.2em; font-size: 14px; }
.drow { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.drow .meta .s { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.drow .meta .t { white-space: normal; overflow-wrap: anywhere; font-weight: 500; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
.codebox { display: grid; justify-items: center; gap: 8px; padding: 14px; margin: 8px 0; background: #fff; border-radius: 16px; color: #000; }
.codebox canvas { max-width: 100%; height: auto; image-rendering: pixelated; }
.codebox .num { font-family: ui-monospace, monospace; font-size: 18px; letter-spacing: .08em; }
.meter { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin: 4px 0 2px; }
.meter i { display: block; height: 100%; width: 0; transition: width .2s, background .2s; }
.gen-out { font-family: ui-monospace, monospace; font-size: 20px; padding: 14px; margin: 8px 0; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; overflow-wrap: anywhere; user-select: all; }
.tgl { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px; }
.tgl input { width: 20px; height: 20px; accent-color: var(--accent); }
.range { width: 100%; accent-color: var(--accent); }

<script>
/* ===== Utilidades ===== */

const debounce = (fn, ms) => { let t; const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; f.flush = () => { clearTimeout(t); fn(); }; f.cancel = () => clearTimeout(t); return f; };

function fmtSize(n) { return n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }

  const d = Date.now() - ms;
  if (d < 45000) return 'ahora';
  if (d < 3600000) return 'hace ' + Math.max(1, Math.round(d / 60000)) + ' min';
  if (d < 86400000) return 'hace ' + Math.round(d / 3600000) + ' h';

}

  $$('.toast').forEach((t) => t.remove());
  const t = el('div', 'toast', msg); t.setAttribute('role', 'status'); $('#layer').appendChild(t); setTimeout(() => t.remove(), ms);
}
const ICONS = {

  left: 'M15 5l-7 7 7 7', right: 'M9 5l7 7-7 7', copy: 'M9 9h11v11H9zM5 15V5h10', pen: 'M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3',
  dots: 'M12 5h.01M12 12h.01M12 19h.01', check: 'M5 12l5 5 9-10', search: 'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4', star: 'M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 2.8 1.1-6.1L3.2 9.4l6.1-.8z', speaker: 'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11', clock: 'M12 4a8 8 0 100 16 8 8 0 000-16zM12 8v4l3 2', shuffle: 'M4 7h4l8 10h4M4 17h4l2-2.5M14 9.5L16 7h4M18 5l2 2-2 2M18 15l2 2-2 2', lock: 'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 017 0v3', unlock: 'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 016.7-1.4', eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z', eyeoff: 'M3 3l18 18M10 6.2A9.5 9.5 0 0112 5c6 0 10 7 10 7a17 17 0 01-3 3.7M6.3 7.6A17 17 0 002 12s4 7 10 7a9.6 9.6 0 004-.9', key: 'M14 10a4 4 0 11-1.2-2.8L21 15v3h-3v-2h-2v-2h-2.5zM8 8.5h.01', card: 'M3 6h18v12H3zM3 10h18M6 15h4', wifi: 'M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 19.5h.01', note: 'M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7', barcode: 'M4 5v14M7 5v14M11 5v14M14 5v14M17 5v14M20 5v14', gear: 'M12 9a3 3 0 100 6 3 3 0 000-6zM19 12l2-1.5-2-3.5-2.3.8-2-1.1L14 4h-4l-.7 2.7-2 1.1L5 7 3 10.5 5 12l-.1 1.2L3 14.5 5 18l2.3-.8 2 1.1L10 21h4l.7-2.7 2-1.1 2.3.8 2-3.5-2-1.5z', finger: 'M12 3a7 7 0 00-7 7M12 3a7 7 0 017 7v2M8 21c-1-2-1-4-1-6a5 5 0 0110 0c0 2 0 4 1 6M12 12v4c0 2 .5 3.5 1 5M9.5 17c.2 1.5.5 2.5 1 4', dice: 'M5 4h14v16H5zM9 8h.01M15 8h.01M12 12h.01M9 16h.01M15 16h.01', play: 'M7 4l13 8-13 8z', pause: 'M7 4h4v16H7zM13 4h4v16h-4z', next: 'M6 5l10 7-10 7zM18 5v14', prev: 'M18 5L8 12l10 7zM6 5v14', repeat: 'M4 11V9a3 3 0 013-3h12l-3-3M20 13v2a3 3 0 01-3 3H5l3 3', music: 'M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zM20 16a3 3 0 11-6 0 3 3 0 016 0z', radio: 'M4 9h16v11H4zM8 9l9-5M8 14.5a2 2 0 100 .01M13 13h5M13 16h5', globe: 'M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18', moon: 'M20 14A8 8 0 019.5 4 8 8 0 1020 14z', list: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01', down: 'M6 9l6 6 6-6', sun: 'M12 8a4 };
function icon(n, s = 24) { return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" aria-hidden="true"><path d="' + (ICONS[n] || '') + '"/></svg>'; }
function paintIcons(r = document) { $$('[data-i]', r).forEach((e) => { if (!e.firstChild) e.innerHTML = icon(e.dataset.i); }); }

/* hojas desde abajo */
let sheetClose = null;
function openSheet(title, build) {
  if (sheetClose) sheetClose();
  const bd = el('div', 'backdrop'), sh = el('div', 'sheet');
  sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true'); sh.setAttribute('aria-label', title);
  sh.appendChild(el('div', 'grab')); sh.appendChild(el('h2', '', title));
  const close = () => { bd.remove(); sh.remove(); if (sheetClose === close) sheetClose = null; if (sh._onClose) sh._onClose(); };
  sheetClose = close; bd.addEventListener('click', close);
  build(sh, close); $('#layer').append(bd, sh);
  return close;
}
function optBtn(ic, label, fn, o) {
  o = o || {};
  const b = el('button', 'opt' + (o.danger ? ' danger' : '')); b.type = 'button';
  b.innerHTML = icon(ic, 22) + '<span>' + esc(label) + '</span>';
  if (o.pressed != null) b.setAttribute('aria-pressed', o.pressed ? 'true' : 'false');
  b.addEventListener('click', fn); return b;
}
const grid = (sh) => { const g = el('div', 'grid'); sh.appendChild(g); return g; };

/* ===== Almacenamiento (IndexedDB; si no hay, memoria) ===== */
const DB = {
  db: null, mem: { scans: new Map(), blobs: new Map() },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('mthi-escaner', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('scans', { keyPath: 'id' }); r.result.createObjectStore('blobs'); };

function genPass(o) {

  let sets = []; const amb = /[0OIl1o]/g;
  const add = (s) => sets.push(o.noamb ? s.replace(amb, '') : s);
  if (o.lower) add('abcdefghijklmnopqrstuvwxyz'); if (o.upper) add('ABCDEFGHIJKLMNOPQRSTUVWXYZ'); if (o.digits) add('0123456789'); if (o.symbols) add('!@#$%^&*()-_=+[]{};:,.?');
  if (!sets.length) sets = ['abcdefghijklmnopqrstuvwxyz']; const all = sets.join('');
  const out = sets.map((s) => s[rint(s.length)]); while (out.length < o.len) out.push(all[rint(all.length)]);
  for (let i = out.length - 1; i > 0; i--) { const j = rint(i + 1); [out[i], out[j]] = [out[j], out[i]]; } return out.slice(0, o.len).join('');
}
function strength(p) {
  if (!p) return { bits: 0, label: '', pct: 0, color: 'var(--line)' };
  let pool = 0; if (/[a-z]/.test(p)) pool += 26; if (/[A-Z]/.test(p)) pool += 26; if (/\d/.test(p)) pool += 10; if (/[^A-Za-z0-9]/.test(p)) pool += 20;
  let bits = p.length * Math.log2(pool || 1); if (/^(.)\1+$/.test(p) || /^(0123|1234|abcd|qwer|password|contraseña)/i.test(p)) bits = Math.min(bits, 20);
  const l = bits < 28 ? ['Muy débil', '#d33'] : bits < 40 ? ['Débil', '#e67e22'] : bits < 60 ? ['Aceptable', '#d4a017'] : bits < 80 ? ['Fuerte', '#2e9e5b'] : ['Muy fuerte', '#0a7c6c'];
  return { bits, label: l[0], pct: Math.min(100, bits / 90 * 100), color: l[1] };
}

    } catch (x) {

      else if (x && x.message === 'bad') err.textContent = 'Clave incorrecta' + (x.left ? ' (' + plural(x.left, 'intento', 'intentos') + ' antes del bloqueo)' : '') + '.';

}
async function tryBio(err, silent) {

/* bloqueo automático */
function armIdle() { clearTimeout(idleT); if (!V.K) return; idleT = setTimeout(() => { if (V.K) showLock(); }, 3 * 60000); }
['pointerdown', 'keydown', 'scroll'].forEach((ev) => document.addEventListener(ev, armIdle, { passive: true, capture: true }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(hideT); if (V.K) hideT = setTimeout(() => { if (document.hidden && V.K) showLock(); }, ((V.rec && V.rec.auto) || 20) * 1000); }
  else { clearTimeout(hideT); if (V.K) armIdle(); }
});

function copy(text, label) {

}
function ask(title, msg, ok, danger) {

    c.addEventListener('click', () => { res(false); close(); }); o.addEventListener('click', () => { res(true); close(); }); r.append(c, o); sh.appendChild(r); sh._onClose = () => res(false);

const mask = (v) => '•'.repeat(Math.min(12, (v || '').length || 8));
function subtitle(it) {

}

/* generador */
function genSheet(onUse) {
  const o = Object.assign({ len: 16, lower: true, upper: true, digits: true, symbols: true, noamb: false, words: false, nw: 4 }, jget('mthi-gen', {}));
  openSheet('Generar contraseña', (sh, close) => {
    const out = el('div', 'gen-out'); sh.appendChild(out); const mt = el('div', 'meter'); mt.innerHTML = '<i></i>'; sh.appendChild(mt); const lb = el('small'); sh.appendChild(lb);
    const make = () => { out.textContent = genPass(o); const s = strength(out.textContent); mt.firstChild.style.width = s.pct + '%'; mt.firstChild.style.background = s.color; lb.textContent = s.label + ' · ' + Math.round(s.bits) + ' bits'; lsSet('mthi-gen', JSON.stringify(o)); };
    const tg = (k, l) => { const w = el('label', 'tgl'); const c = el('input'); c.type = 'checkbox'; c.checked = !!o[k]; c.addEventListener('change', () => { o[k] = c.checked; make(); }); w.append(c, document.createTextNode(l)); return w; };
    const rg = el('label', 'field'); const rl = el('span', '', 'Longitud: ' + o.len); const r = el('input', 'range'); r.type = 'range'; r.min = 8; r.max = 40; r.value = o.len; r.addEventListener('input', () => { o.len = +r.value; rl.textContent = 'Longitud: ' + o.len; make(); }); rg.append(rl, r);
    const wd = el('label', 'tgl'); const wc = el('input'); wc.type = 'checkbox'; wc.checked = o.words; wd.append(wc, document.createTextNode('Frase fácil de recordar (palabras)'));
    const opts = el('div'); const fill = () => { opts.textContent = ''; if (o.words) opts.append(tg('digits', 'Agregar número')); else opts.append(rg, tg('lower', 'minúsculas'), tg('upper', 'MAYÚSCULAS'), tg('digits', 'Números'), tg('symbols', 'Símbolos'), tg('noamb', 'Evitar caracteres confusos (0 O l 1)')); };
    wc.addEventListener('change', () => { o.words = wc.checked; fill(); make(); }); sh.append(wd, opts); fill();
    const rb = el('div', 'rowbtn'); const re = el('button', 'btn', 'Otra'); re.type = 'button'; re.addEventListener('click', make);
    const cp = el('button', 'btn', 'Copiar'); cp.type = 'button'; cp.addEventListener('click', () => copy(out.textContent, 'Contraseña copiada')); rb.append(re, cp);

    sh.appendChild(rb); make();
  });

function askPass(title, msg) {
  return new Promise((res) => openSheet(title, (sh, close) => {
    const f = el('form'); f.noValidate = true; const l = el('label', 'field'); l.append(msg); const i = el('input'); i.type = 'password'; i.autocomplete = 'off'; l.appendChild(i); f.appendChild(l);
    const b = el('button', 'btn primary', 'Aceptar'); b.type = 'submit'; f.appendChild(b); sh.appendChild(f); let done = false;
    f.addEventListener('submit', (e) => { e.preventDefault(); done = true; res(i.value); close(); }); sh._onClose = () => { if (!done) res(null); }; setTimeout(() => i.focus(), 150);
  }));
}

  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  showLock();
}
